name: Build APK

# The APK is built here rather than on a laptop, so anyone can grab a fresh
# install file without setting up the Android SDK.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK something a human can recognise
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/anti-social.apk"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-social-apk
          path: out/anti-social.apk
          if-no-files-found: error

      # A release gives a plain download link that can be opened on a phone,
      # which is the whole point of building it here.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/anti-social.apk \
            --title "Anti-Social (latest build)" \
            --notes "Built from ${{ github.sha }}. Download anti-social.apk on your Android phone and open it to install."
